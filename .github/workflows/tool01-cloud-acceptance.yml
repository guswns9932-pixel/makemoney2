name: Tool01 Cloud Acceptance

on:
  push:
    branches: ["**"]
    paths:
      - "products/tool01/**"
      - ".github/workflows/tool01-cloud-acceptance.yml"
  pull_request:
    paths:
      - "products/tool01/**"
      - ".github/workflows/tool01-cloud-acceptance.yml"
  workflow_dispatch: {}

defaults:
  run:
    working-directory: products/tool01

jobs:
  cloud-acceptance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install LibreOffice / Xvfb / Korean fonts / poppler
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice xvfb fonts-nanum poppler-utils python3-tk

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Logical Regression
        run: |
          set -o pipefail
          TOOL01_RENDERER=libreoffice python -m pytest tests/ -q -m "not live_renderer" 2>&1 | tee regression.log

      - name: Xvfb GUI Regression
        run: |
          set -o pipefail
          xvfb-run -a python -m pytest tests/test_main_gui.py -q 2>&1 | tee gui_regression.log

      - name: Cloud Acceptance (O01-O09)
        run: |
          set -o pipefail
          TOOL01_RENDERER=libreoffice TOOL01_LO_BATCH_SIZE=5 \
            python scripts/cloud_acceptance.py --output artifacts/cloud_acceptance 2>&1 | tee cloud_acceptance.log

      - name: Upload Cloud Acceptance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tool01-cloud-acceptance
          if-no-files-found: warn
          path: |
            products/tool01/regression.log
            products/tool01/gui_regression.log
            products/tool01/cloud_acceptance.log
            products/tool01/artifacts/cloud_acceptance/**
